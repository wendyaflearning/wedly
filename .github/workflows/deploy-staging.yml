name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wedly-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_github_actions
          chmod 600 ~/.ssh/id_ed25519_github_actions
          cat >> ~/.ssh/known_hosts << 'KNOWNHOSTS'
          |1|VvfoFmsRmdyb/BNxXD7ZpjkC6bk=|UVkbvo4+eZblje2SQlMn0yLTNNY= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGIGVQ+57CNAbDiqcC4TrL6jJIi+9WiCaYqRtjvQ0Exx
          |1|34Zi+wsx6d7uOAn9q71wSO51yww=|H0tauFL9z80YLUgutalZay+4nkY= ssh-rsa 
          |1|iSLKEfCif/rs/TJPBI3/g8ufKrs=|coQGQL6Zf8ZkD5hQ+R1CVrk+ZzM= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPACbwiiFvUXhxuJQuABFopZ2G9fjnDubCQumBfKwFnxMiOQ9+NaNeX3o7MweRMJRfkshGH9/LXbfj3tr5TyWzU=
          72.60.84.168 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGIGVQ+57CNAbDiqcC4TrL6jJIi+9WiCaYqRtjvQ0Exx
          72.60.84.168 ssh-rsa 
          72.60.84.168 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPACbwiiFvUXhxuJQuABFopZ2G9fjnDubCQumBfKwFnxMiOQ9+NaNeX3o7MweRMJRfkshGH9/LXbfj3tr5TyWzU=
          KNOWNHOSTS

      - name: Generate & deploy JWT keypair (staging)
        run: |
          mkdir -p /tmp/jwt
          openssl genpkey -out /tmp/jwt/private.pem -aes256 -algorithm rsa \
            -pkeyopt rsa_keygen_bits:4096 -pass pass:"${{ secrets.JWT_PASSPHRASE_STAGING }}"
          openssl pkey -in /tmp/jwt/private.pem -passin pass:"${{ secrets.JWT_PASSPHRASE_STAGING }}" \
            -out /tmp/jwt/public.pem -pubout
          ssh -i ~/.ssh/id_ed25519_github_actions ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/staging/config/jwt"
          scp -i ~/.ssh/id_ed25519_github_actions /tmp/jwt/private.pem /tmp/jwt/public.pem \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/staging/config/jwt/
          ssh -i ~/.ssh/id_ed25519_github_actions ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod 644 /root/staging/config/jwt/private.pem /root/staging/config/jwt/public.pem"

      - name: Sync docker-compose.staging.yml to VPS
        run: |
          for i in 1 2 3; do
            scp -i ~/.ssh/id_ed25519_github_actions \
              apps/api/docker/docker-compose.staging.yml \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/staging/docker-compose.yml && break
            echo "Tentative $i échouée, nouvel essai dans 10s..."
            sleep 10
          done

      - name: Write .env on VPS (staging)
        run: |
          for i in 1 2 3; do
          ssh -i ~/.ssh/id_ed25519_github_actions ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cat > /root/staging/.env" << EOF && break
          DATABASE_URL_STAGING=${{ secrets.DATABASE_URL_STAGING }}
          APP_DEBUG=0
          POSTGRES_PASSWORD_STAGING=${{ secrets.POSTGRES_PASSWORD_STAGING }}
          JWT_PASSPHRASE_STAGING=${{ secrets.JWT_PASSPHRASE_STAGING }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          MAILER_DSN=${{ secrets.MAILER_DSN }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK=${{ secrets.SLACK_WEBHOOK }}
          VENDOR_FEEDBACK_SLACK_WEBHOOK_URL=${{ secrets.VENDOR_FEEDBACK_SLACK_WEBHOOK_URL }}
          PAPPERS_API_TOKEN=${{ secrets.PAPPERS_API_TOKEN }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CORS_ALLOW_ORIGIN='^https://staging\.wedly-apps\.com$'
          EOF
          echo "Tentative $i échouée, nouvel essai dans 10s..."
          sleep 10
          done

      - name: Deploy on VPS (staging)
        run: |
          for i in 1 2 3; do
            ssh -i ~/.ssh/id_ed25519_github_actions ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
              cd /root/staging && \
              docker compose -p wedly-staging pull symfony-staging && \
              docker compose -p wedly-staging up -d postgres-staging && \
              sleep 5 && \
              docker compose -p wedly-staging run --rm symfony-staging php bin/console doctrine:migrations:migrate --no-interaction && \
              docker compose -p wedly-staging run --rm symfony-staging php bin/console cache:clear --env=staging && \
              docker compose -p wedly-staging up -d symfony-staging" && break
            echo "Tentative $i échouée, nouvel essai dans 10s..."
            sleep 10
          done
