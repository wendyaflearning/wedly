name: Deploy to VPS

on:
  push:
    branches: [develop, feature/feature/ci-migrations]
    paths:
      - 'apps/api/**'
      - '.github/workflows/**'
      - 'composer.json'
      - 'composer.lock'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-dev --optimize-autoloader --no-scripts

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wedly-api:latest

      - name: Write .env.wedly on VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_hostinger
          chmod 600 ~/.ssh/id_ed25519_hostinger
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519_hostinger ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cat > /root/.env.wedly << 'EOF'
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY=/var/www/html/config/jwt/private.pem
          JWT_PUBLIC_KEY=/var/www/html/config/jwt/public.pem
          JWT_PASSPHRASE=
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          PAPPERS_API_TOKEN=${{ secrets.PAPPERS_API_TOKEN }}
          MAILER_DSN=${{ secrets.MAILER_DSN }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SLACK_WEBHOOK=${{ secrets.VENDOR_FEEDBACK_SLACK_WEBHOOK_URL }}
          VENDOR_FEEDBACK_SLACK_WEBHOOK_URL=${{ secrets.VENDOR_FEEDBACK_SLACK_WEBHOOK_URL }}
          EOF"

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519_hostinger ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            cd /root && \
            docker compose pull symfony && \
            docker compose run --rm symfony php bin/console doctrine:migrations:migrate --no-interaction && \
            docker compose run --rm symfony php bin/console app:seed-specialties --no-interaction && \
            docker compose up -d symfony"
