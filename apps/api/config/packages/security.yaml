security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        couple_provider:
            id: App\Security\CoupleUserProvider
        vendor_provider:
            id: App\Security\VendorUserProvider
        chain_provider:
            chain:
                providers: [couple_provider, vendor_provider]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/v1/login$
            stateless: true
            provider: chain_provider
            json_login:
                check_path: /api/v1/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: chain_provider
            jwt: ~

    access_control:
        - { path: ^/api/v1/login$,    roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api,              roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
