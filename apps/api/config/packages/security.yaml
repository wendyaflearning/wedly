security:
    password_hashers:
        App\Entity\User\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/v1/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/v1/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/v1/login$,               roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/register$,            roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/invite-tokens/,       roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/vendors/onboarding/,  roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/onboarding/,          roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/services$,            roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/services/[0-9a-fA-F-]{36}/tag-types$', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/tag-values/[0-9a-fA-F-]{36}/portfolio-images$', roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/styles$,               roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/specialties$,          roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/confessions$,         roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/cultures$,            roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/regions$,                 roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/forgot-password$,  roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/reset-password$,   roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/logout$,           roles: PUBLIC_ACCESS }
        - { path: ^/api,                           roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
