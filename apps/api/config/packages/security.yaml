security:
    password_hashers:
        App\Entity\User\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/v1/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/v1/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        invite_tokens:
            pattern: ^/api/v1/invite-tokens/
            security: false

        vendor_onboarding:
            pattern: ^/api/v1/vendors/onboarding/
            security: false

        get_onboarding:
            pattern: ^/api/v1/onboarding/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/v1/login$,    roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api,              roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
